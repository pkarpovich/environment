# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: fix-ru prompt iteration - Edith v7s vs v8 on sonnet 5.5 medium, corpus + holdout

prompts:
  - id: file://render.js:edithV9
    label: v9

providers:
  - id: anthropic:messages:claude-sonnet-5-5
    label: sonnet-5-5-medium
    transform: "(typeof output === 'string' ? JSON.parse(output) : output).text"
    config: &edith
      max_tokens: 16000
      effort: medium
      showThinking: false
      output_format:
        type: json_schema
        schema:
          type: object
          properties:
            text:
              type: string
          required: [text]
          additionalProperties: false

defaultTest:
  options:
    provider: anthropic:messages:claude-opus-5-5
  assert:
    - type: javascript
      value: file://asserts.js:noYo
    - type: javascript
      value: file://asserts.js:plainHyphen
    - type: javascript
      value: file://asserts.js:noTrailingPeriod
    - type: javascript
      value: file://asserts.js:firstCharCase
    - type: javascript
      value: file://asserts.js:caseNotRaised
    - type: javascript
      value: file://asserts.js:textOnly
    - type: javascript
      value: file://asserts.js:unchangedWhenValid
    - type: llm-rubric
      value: |
        A Russian chat message was handed to a proofreader whose job is to make it grammatically
        correct Russian while keeping it the author's own text. Judge the output against the original.

        Original message:
        {{input}}

        Reference notes for this message (required fixes and acceptable alternatives):
        {{must_fix}}

        The author's conventions, which are correct by definition here: "е" instead of "ё"; a plain
        hyphen instead of em/en dashes; no period ending the message; a lowercase sentence start
        after ".", "?" or "!" is intentional and must stay lowercase.

        Grade PASS only when all three hold:

        1. Every required fix in the notes is made (an alternative the notes call acceptable counts).
        2. The output has no remaining spelling, grammar or punctuation error by the rules of Russian,
           given the conventions above. Loanwords with an established dictionary spelling use it;
           slang with no dictionary form may stay as typed. Punctuation the notes call acceptable
           either way is not an error.
        3. Nothing else moved: word choice, word order, slang, abbreviations, Latin-script terms,
           product names, URLs and register are as in the original. Rephrasing a correct fragment,
           adding or dropping words, or wrapping the message in commentary is a FAIL.

        When the notes say "nothing, the message is already correct", PASS requires the output to
        be character-identical to the original.

tests:
  - file://cases.yaml
  - file://holdout.yaml
