- defaults:
    link:
      create: true
      relink: true
      force: true
      glob: true

- link:
    ~/.config/mise/config.toml: mise.config.toml
    ~/.config/yazi/yazi.toml: yazi.toml

    ~/.config/karabinder.json: ../karabiner/dist/karabiner.json

    ~/.config/wezterm/: wezterm/**

    # zsh is the login shell only for agterm's Live sessions gate; zshrc execs fish
    ~/.zshrc: zsh/zshrc
    ~/.zprofile: zsh/zprofile
    ~/.config/zed/: zed/**
    ~/.config/tmux/: tmux/**
    ~/.config/tmux-palette/: tmux-palette/**
    ~/.config/agterm/: agterm/**
    ~/.config/yashiki/: yashiki/**

    ~/.claude/: claude/**
    ~/.claude-work/: claude/**
    ~/.agents: agents
    ~/.config/revdiff/: revdiff/**
    ~/.config/revmux/: revmux/**
    ~/.config/1Password/ssh/agent.toml: 1password/agent.toml

    ~/.config/yafetch/init.lua: yafetch.lua
    ~/Library/LaunchAgents/com.pavel-karpovich.colima.plist: colima/com.pavel-karpovich.colima.plist
    ~/Library/LaunchAgents/com.pavel-karpovich.cc-map-watch.plist: agterm/com.pavel-karpovich.cc-map-watch.plist
    ~/Library/Application Support/Claude/claude_desktop_config.json: claude_desktop_config.json
    ~/Library/Application Support/Tuna/config.toml: tuna/config.toml
    ~/Library/Application Support/Tuna/Prompts: tuna-prompts/**
    /opt/homebrew/etc/Caddyfile: Caddyfile
