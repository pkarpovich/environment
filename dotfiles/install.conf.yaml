- defaults:
    link:
      create: true
      relink: true
      force: true
      glob: true

- link:
    ~/.gitignore_global: .gitignore_global
    ~/.gitconfig: .gitconfig

    ~/.config/mise/config.toml: mise.config.toml
    ~/.config/starship.toml: starship.toml
    ~/.config/yazi/yazi.toml: yazi.toml

    ~/.config/karabinder.json: ../karabiner/dist/karabiner.json

    ~/.config/wezterm/: wezterm/**
    ~/.config/fish/config.fish: fish/config.fish
    ~/.config/fish/fish_plugins: fish/fish_plugins
    ~/.config/fish/functions/: fish/functions/**
    ~/.config/zed/: zed/**
    ~/.config/zellij/: zellij/**
    ~/.config/agterm/: agterm/**
    ~/.config/yashiki/: yashiki/**

    ~/.claude/: claude/**
    ~/.claude-work/: claude/**
    ~/.config/revdiff/: revdiff/**
    ~/.config/1Password/ssh/agent.toml: 1password/agent.toml

    ~/.config/yafetch/init.lua: yafetch.lua
    ~/.mcpjungle.conf: .mcpjungle.conf
    ~/Library/Application Support/Claude/claude_desktop_config.json: claude_desktop_config.json
    ~/Library/Application Support/Tuna/config.toml: tuna/config.toml
    /opt/homebrew/etc/Caddyfile: Caddyfile
