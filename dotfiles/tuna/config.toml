[hotkeys]
custom = []

    [hotkeys.app.activate]
    carbonKeyCode = 49
    carbonModifiers = 256

    [hotkeys.app.dictation]
    carbonKeyCode = 105
    carbonModifiers = 0

[settings]
comboModeDoublePressTrigger = 'leftOption'
comboModeModifierTrigger = 'hyper'
comboModeTriggerType = 'modifier'
physicalHyperKeySource = 'capsLock'
shelfAutoCloseWhenTasksComplete = true
textModeTriggerType = 'disabled'

