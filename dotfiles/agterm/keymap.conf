# agterm keymap — wezterm muscle-memory port (originals: dotfiles/wezterm/keybinds.lua).
# Built-in action names and shipped defaults: Settings ▸ Key Mapping or the app's starter file.
# Apply with File ▸ Reload Keymap or `agtermctl keymap reload`.

# splits: Cmd+Shift+| toggles the side-by-side split, Cmd+Shift+_ the scratch shell
map cmd+shift+\ toggle_split
map cmd+shift+- toggle_scratch

# session nav, wezterm tab-style: Cmd+Shift+[ / ]
map cmd+shift+[ previous_session
map cmd+shift+] next_session

# session lifecycle, wezterm tab-style: Cmd+Shift+T new, Cmd+Shift+W close
# (reopen_recent moves off its cmd+shift+t default to make room)
map cmd+shift+t new_session
map cmd+opt+t reopen_recent
map cmd+shift+w close_session

# command palette on Cmd+Shift+P as in wezterm (agterm default: ctrl+shift+p)
map cmd+shift+p command_palette

# session switcher on Cmd+P (agterm default: ctrl+p)
map cmd+p session_palette

# sidebar on the physical "/" key (Universal layout puts / on the backslash key;
# its cmd layer mirrors US, so AppKit sees that key as cmd+\ in menu equivalents)
map cmd+\ toggle_sidebar

# wezterm leader (Cmd+Shift+L) sub-commands
command "Balance Split" cmd+shift+l>= agtermctl session resize --split-ratio 0.5 --socket "$AGT_SOCKET"

# jump to Nth session in sidebar order (wezterm Cmd+Shift+1..9 tab habit).
# The Universal layout puts symbols on the UNSHIFTED digit row (!@#$%^?*(), digits
# on shift), and agterm's key monitor normalizes a chord to the key's unmodified
# base char - so the digit-row keys must be spelled by those symbols here.
command "Go to session 1" cmd+shift+! ~/.config/agterm/scripts/go-session.sh 1
command "Go to session 2" cmd+shift+@ ~/.config/agterm/scripts/go-session.sh 2
command "Go to session 3" cmd+shift+# ~/.config/agterm/scripts/go-session.sh 3
command "Go to session 4" cmd+shift+$ ~/.config/agterm/scripts/go-session.sh 4
command "Go to session 5" cmd+shift+% ~/.config/agterm/scripts/go-session.sh 5
command "Go to session 6" cmd+shift+^ ~/.config/agterm/scripts/go-session.sh 6
command "Go to session 7" cmd+shift+? ~/.config/agterm/scripts/go-session.sh 7
command "Go to session 8" cmd+shift+* ~/.config/agterm/scripts/go-session.sh 8
command "Go to session 9" cmd+shift+( ~/.config/agterm/scripts/go-session.sh 9

# reopen all Claude sessions (catch up after working from the second Mac via zellij)
command "Reopen CC sessions" cmd+shift+l>r ~/.config/agterm/scripts/reopen-cc.sh
