# agterm keymap — wezterm muscle-memory port (originals: dotfiles/wezterm/keybinds.lua).
# Built-in action names and shipped defaults: Settings ▸ Key Mapping or the app's starter file.
# Apply with File ▸ Reload Keymap or `agtermctl keymap reload`.

# splits: Cmd+Shift+| toggles the side-by-side split, Cmd+Shift+_ the scratch shell
map cmd+shift+\ toggle_split
map cmd+shift+- toggle_scratch

# session nav, wezterm tab-style: Cmd+Shift+[ / ]
map cmd+shift+[ previous_session
map cmd+shift+] next_session

# session lifecycle, wezterm tab-style: Cmd+Shift+T new, Cmd+Shift+W close
# (reopen_recent moves off its cmd+shift+t default to make room)
map cmd+shift+t new_session
map cmd+opt+t reopen_recent
map cmd+shift+w close_session

# command palette on Cmd+Shift+P as in wezterm (agterm default: ctrl+shift+p)
map cmd+shift+p command_palette

# session switcher on Cmd+S: Cmd+P is the script palette now, and Cmd+F stays the
# scrollback search
map cmd+s session_palette

# quick terminal on Cmd+J. Its own default is ctrl+` , which the Universal layout
# puts somewhere else entirely
map cmd+j quick_terminal

# sidebar on the physical "/" key (Universal layout puts / on the backslash key;
# its cmd layer mirrors US, so AppKit sees that key as cmd+\ in menu equivalents)
map cmd+\ toggle_sidebar

# wezterm leader (Cmd+Shift+L) sub-commands
command "Balance Split" cmd+shift+l>= agtermctl session resize --split-ratio 0.5 --socket "$AGT_SOCKET"

# jump to Nth session in sidebar order (wezterm Cmd+Shift+1..9 tab habit).
# The Universal layout puts symbols on the UNSHIFTED digit row (!@#$%^?*(), digits
# on shift), and agterm's key monitor normalizes a chord to the key's unmodified
# base char - so the digit-row keys must be spelled by those symbols here.
command "Go to session 1" cmd+shift+! ~/.config/agterm/scripts/go-session.fish 1
command "Go to session 2" cmd+shift+@ ~/.config/agterm/scripts/go-session.fish 2
command "Go to session 3" cmd+shift+# ~/.config/agterm/scripts/go-session.fish 3
command "Go to session 4" cmd+shift+$ ~/.config/agterm/scripts/go-session.fish 4
command "Go to session 5" cmd+shift+% ~/.config/agterm/scripts/go-session.fish 5
command "Go to session 6" cmd+shift+^ ~/.config/agterm/scripts/go-session.fish 6
command "Go to session 7" cmd+shift+? ~/.config/agterm/scripts/go-session.fish 7
command "Go to session 8" cmd+shift+* ~/.config/agterm/scripts/go-session.fish 8
command "Go to session 9" cmd+shift+( ~/.config/agterm/scripts/go-session.fish 9

# recap what the Claude run in this session has been doing, in a floating overlay.
# No chord on purpose: it lives in the script palette below
command "Claude Recap" ~/.config/agterm/scripts/cc-recap.fish

# every custom script that carries an @agt.name marker, in agterm's
# own fuzzy picker (agterm >= 0.19.0); picking a row runs it
command "Run Script..." cmd+p ~/.config/agterm/scripts/run-script.fish

# reopen all Claude sessions (catch up after working from the second Mac via tmux)
command "Reopen CC sessions" cmd+shift+l>r ~/.config/agterm/scripts/reopen-cc.fish

# same, but only this session - the rest keeps running on whichever side it is on
command "Reopen this CC session" ~/.config/agterm/scripts/reopen-cc.fish "$AGT_SESSION_ID"

# fork this session's Claude conversation into a new session next to it
command "Fork Claude session" ~/.config/agterm/scripts/fork-cc.fish

# open this session's directory elsewhere (`e` / `gg` / `f` aliases). Absolute
# binary paths: a custom command runs as a detached /bin/sh with the app's GUI
# PATH, where ~/.local/bin and the Homebrew prefix are absent. The quoted env
# var, not the raw {AGT_SESSION_PWD} token: the cwd comes from OSC 7 and a
# remote host could inject shell syntax through it.
command "Open in Zed" cmd+shift+e /usr/local/bin/zed "$AGT_SESSION_PWD"
command "Open in Sublime Merge" /usr/bin/open -a "Sublime Merge" "$AGT_SESSION_PWD"
command "Reveal in Finder" /opt/homebrew/bin/agtermctl session reveal --target "$AGT_SESSION_ID" --socket "$AGT_SOCKET"
