# agterm-scoped ghostty config — applies ONLY to agterm, not the standalone Ghostty.app.
# Key reference: https://ghostty.org/docs/config. UI-managed keys (font, theme, background
# opacity/blur, scroll speed) live in agterm Settings and always win over this file.
# Apply with File ▸ Reload Config or `agtermctl config reload`.

# option sends Alt (wezterm behavior; the zellij Alt-bindings depend on it)
macos-option-as-alt = true

# readline-style Cmd shortcuts (wezterm parity): Home / End / kill-line
keybind = super+arrow_left=text:\x1bOH
keybind = super+arrow_right=text:\x1bOF
keybind = super+backspace=text:\x15

# Shift+Enter -> ESC+CR (Claude Code multiline input, wezterm parity)
keybind = shift+enter=text:\x1b\r

# zellij mirror: Ctrl+Shift symbols/digits -> PUA tokens U+E010..E01D. zellij 0.44 can't
# match shifted symbols under the kitty keyboard protocol (zellij#4148), so the terminal
# sends private tokens that dotfiles/zellij/config.kdl binds directly. Letters and arrows
# (Ctrl+Shift+z/x/t/w/v/l, Ctrl+Shift+arrows) reach zellij natively — nothing binds them here.
keybind = ctrl+shift+backslash=text:\u{E010}
keybind = ctrl+shift+minus=text:\u{E011}
keybind = ctrl+shift+bracket_left=text:\u{E012}
keybind = ctrl+shift+bracket_right=text:\u{E013}
keybind = ctrl+shift+digit_1=text:\u{E014}
keybind = ctrl+shift+digit_2=text:\u{E015}
keybind = ctrl+shift+digit_3=text:\u{E016}
keybind = ctrl+shift+digit_4=text:\u{E017}
keybind = ctrl+shift+digit_5=text:\u{E018}
keybind = ctrl+shift+digit_6=text:\u{E019}
keybind = ctrl+shift+digit_7=text:\u{E01A}
keybind = ctrl+shift+digit_8=text:\u{E01B}
keybind = ctrl+shift+digit_9=text:\u{E01C}
keybind = ctrl+shift+digit_0=text:\u{E01D}
