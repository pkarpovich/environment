[tools]
node = "22"
pnpm = { version = "9", os = ["macos"] }
go = { version = "1.23", os = ["macos"] }
python = "3.13"
rust = { version = "1.93", os = ["macos"] }
deno = { version = "2.7", os = ["macos"] }
"npm:cf" = { version = "0.15", os = ["macos"] }
uv = "0.13"

# macOS keeps dev debug info in per-CGU .o files ("unpacked") and cargo never
# deletes the stale ones: target/ grew to 58 GB. packed writes one .dSYM per
# binary instead, backtraces keep file:line.
[env]
CARGO_PROFILE_DEV_DEBUG = "line-tables-only"
CARGO_PROFILE_DEV_SPLIT_DEBUGINFO = "packed"

[settings]
experimental = true
# pinned so a shell still carrying the old per-version RUSTUP_HOME cannot pull
# core rust into its own install path (a symlink loop)
rust.cargo_home = "~/.cargo"
rust.rustup_home = "~/.rustup"
