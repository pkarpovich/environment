hwdec=auto-safe

# streamcast sends its TS in bursts of about 5 seconds; mpv starts on an empty
# cache and drains it to zero before the next burst lands, so start with more
# than one burst in hand
[streamcast]
profile-cond=path:find("streamcast.pkarpovich.space", 1, true) ~= nil
profile-restore=copy
cache=yes
cache-pause-initial=yes
cache-pause-wait=8
demuxer-readahead-secs=10
