# tmux is the SSH/mosh attach point for the second Mac and the phone: agterm runs
# the Claude sessions on the main Mac, `ccz` mirrors them into windows here.
#
# It replaced zellij because Moshi's chat only speaks tmux. moshi-hook carries
# attachTmuxPreview / applyTmuxAgentStatus / buildTmuxTree / focusTmuxWorkspace
# with no zellij counterpart - the zellij path can send keys and grab a single
# snapshot, and that is all.

# ===== base =====
set -g default-terminal "tmux-256color"
set -as terminal-features "*:RGB"

# legacy encoding drops Shift on control keys, so Ctrl+Shift+<letter> arrives as
# plain Ctrl+<letter>. The whole wezterm mirror below depends on extended keys.
#
# "always", not "on": with "on" tmux asks the outer terminal for extended keys
# only when an application inside asks first, so with a plain shell (or a TUI
# that never asks) Ctrl+Shift+L collapses to Ctrl+L and the pane eats it instead
# of the leader firing.
set -s extended-keys always
set -as terminal-features "*:extkeys"

# Alt bindings and Claude's Esc must not wait for a longer sequence
set -s escape-time 0

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
# Ctrl+Shift+<N> targets the position you see, not the window's birth order
set -g renumber-windows on
set -g set-clipboard on
# image paste from the phone reaches the pane instead of being eaten by tmux
set -g allow-passthrough on

# No prefix at all: Ctrl+B stays with Claude Code (background command), and the
# leader is Ctrl+Shift+L, the same one wezterm and agterm use.
set -g prefix None
unbind C-b

# ===== normal mode =====
# Nothing lives here except the window list: the Mac side binds no Alt at all
# (agterm/keymap.conf is Cmd+Shift only), so the Alt block zellij carried was
# clutter that also stole Alt+arrows and Alt+b/f from fish and Claude Code.
#
# Ctrl+/ is the same physical key in both layouts, so no Cyrillic twin; C-_ is
# what the terminal sends for it whenever extended keys are not in play.
bind -n C-_ choose-tree -Zw
bind -n C-/ choose-tree -Zw

# ===== wezterm mirror: Cmd+Shift -> Ctrl+Shift =====
# Symbols and digits arrive as the PUA tokens U+E010..U+E01D that
# agterm/ghostty.conf and wezterm/keybinds.lua send. That translation was a
# zellij workaround (#4148) - tmux could read the real keys through extended
# keys - but binding the tokens here keeps both terminal configs untouched.
bind -n  split-window -h -c "#{pane_current_path}"
bind -n  split-window -v -c "#{pane_current_path}"
bind -n  previous-window
bind -n  next-window
bind -n  select-window -t 1
bind -n  select-window -t 2
bind -n  select-window -t 3
bind -n  select-window -t 4
bind -n  select-window -t 5
bind -n  select-window -t 6
bind -n  select-window -t 7
bind -n  select-window -t 8
bind -n  select-window -t 9
bind -n  select-window -t 10

# The five letters arrive as tokens too when the client is wezterm on the MBA:
# it answers only the kitty keyboard protocol, and tmux asks for xterm's
# modifyOtherKeys, so Ctrl+Shift+<letter> would collapse to Ctrl+<letter> and be
# eaten by the pane. The native C-S-* bindings below stay for terminals that do
# answer the request (agterm on the Mac itself).
bind -n  switch-client -T leader
bind -n  resize-pane -Z
bind -n  kill-pane
bind -n  new-window -c "#{pane_current_path}"
bind -n  kill-window

bind -n C-S-Left  select-pane -L
bind -n C-S-Down  select-pane -D
bind -n C-S-Up    select-pane -U
bind -n C-S-Right select-pane -R

bind -n C-S-z resize-pane -Z
bind -n C-S-я resize-pane -Z
bind -n C-S-x kill-pane
bind -n C-S-ч kill-pane
bind -n C-S-t new-window -c "#{pane_current_path}"
bind -n C-S-е new-window -c "#{pane_current_path}"
bind -n C-S-w kill-window
bind -n C-S-ц kill-window
bind -n C-S-l switch-client -T leader
bind -n C-S-д switch-client -T leader

# ===== leader submode, entered via Ctrl+Shift+L =====
# One key and tmux drops back to the root table on its own.

# mirror one more agterm session into a window here. The picker runs in a popup
# that closes itself, so no scratch window is left behind just to type it.
bind -T leader m display-popup -E -w 70% -h 60% -T 'mirror agterm session' fish -c 'ccz --one'
bind -T leader ь display-popup -E -w 70% -h 60% -T 'mirror agterm session' fish -c 'ccz --one'

bind -T leader s choose-tree -Zs
bind -T leader ы choose-tree -Zs

# the Mac's "Balance Split" (Cmd+Shift+L =), same chord
bind -T leader = select-layout even-horizontal

# leave the session running (what you want when switching Macs)
bind -T leader d detach-client
bind -T leader в detach-client

# tear the whole session down, killing everything in it
bind -T leader q kill-session
bind -T leader й kill-session

bind -T leader z resize-pane -Z
bind -T leader я resize-pane -Z
bind -T leader c kill-pane
bind -T leader с kill-pane
bind -T leader x kill-pane
bind -T leader ч kill-pane
bind -T leader t break-pane
bind -T leader е break-pane
bind -T leader w break-pane
bind -T leader ц break-pane
bind -T leader Escape switch-client -T root
